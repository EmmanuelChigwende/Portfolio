<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .bg { fill: #0F1720; }
      .ring { fill: none; stroke: #6FCF97; stroke-width: 2.5; }
      .tick { stroke: #263340; stroke-width: 2; }
      .tick-live { stroke: #6FCF97; stroke-width: 2; }
      .glyph { fill: #E7EDF3; font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Kaku Gothic Pro", "Yu Gothic", sans-serif; }
      .node { fill: #E0A458; }
    </style>
  </defs>

  <!-- outer plate -->
  <circle class="bg" cx="120" cy="120" r="112"/>
  <circle class="ring" cx="120" cy="120" r="104"/>

  <!-- dial ticks around the ring, like the topology diagram's node markers -->
  <g>
    <line class="tick-live" x1="120" y1="10" x2="120" y2="22"/>
    <line class="tick" x1="120" y1="218" x2="120" y2="230"/>
    <line class="tick" x1="10" y1="120" x2="22" y2="120"/>
    <line class="tick" x1="218" y1="120" x2="230" y2="120"/>
    <line class="tick" x1="41" y1="41" x2="49" y2="49"/>
    <line class="tick" x1="199" y1="41" x2="191" y2="49"/>
    <line class="tick" x1="41" y1="199" x2="49" y2="191"/>
    <line class="tick" x1="199" y1="199" x2="191" y2="191"/>
  </g>

  <!-- small active node marker at the top tick, echoing the site's status dots -->
  <circle class="node" cx="120" cy="16" r="4"/>

  <!-- hiragana: ki / yo -->
  <text x="120" y="108" text-anchor="middle" class="glyph" font-size="70" font-weight="500">き</text>
  <text x="120" y="180" text-anchor="middle" class="glyph" font-size="70" font-weight="500">よ</text>
</svg>
